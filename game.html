<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM GAME - Win Go</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
body { background-color: #222222; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding-bottom: 20px; }
.game-container { width: 100%; max-width: 450px; background-color: #191919; display: flex; flex-direction: column; overflow-x: hidden; position: relative; padding: 12px; gap: 12px; }
.top-nav-header { display: flex; align-items: center; justify-content: space-between; padding: 5px 0px; background-color: #191919; border-bottom: 1px solid #2d2d2d; width: 100%; }
.back-btn-box { display: flex; align-items: center; cursor: pointer; color: #ffffff; background: none; border: none; }
.back-icon-svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.header-center-title { font-size: 16px; font-weight: bold; color: #ffffff; flex: 1; text-align: center; margin-right: 24px; }
.wallet-section { background-color: #2b2b2b; border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.balance-title { font-size: 24px; font-weight: bold; color: #ffffff; margin-bottom: 5px; }
.wallet-sub { font-size: 12px; color: #aaaaaa; display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 15px; }
.wallet-buttons { display: flex; gap: 15px; }
.wl-btn { flex: 1; border: none; padding: 12px; border-radius: 25px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; }
.wl-withdraw { background-color: #d32f2f; }
.wl-deposit { background-color: #2aa453; }
.game-modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background-color: #252525; padding: 10px; border-radius: 12px; }
.mode-btn { background: #333; border: none; border-radius: 8px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: #bbb; font-size: 10px; }
.mode-btn.active { background: linear-gradient(180deg, #fbe29a, #cda24d); color: #4a3200; font-weight: bold; }
.mode-icon { width: 20px; height: 20px; background: #555; border-radius: 50%; }
.mode-btn.active .mode-icon { background: #4a3200; }
.timer-panel { background: linear-gradient(135deg, #fbe29a, #e4bf6b); color: #4a3200; border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
.timer-left { display: flex; flex-direction: column; gap: 4px; }
.game-title { font-size: 13px; font-weight: bold; }
.recent-balls { display: flex; gap: 3px; margin-top: 5px; }
.ball-sm { width: 16px; height: 16px; border-radius: 50%; font-size: 9px; color: white; text-align: center; line-height: 16px; font-weight: bold; }
.timer-right { display: flex; flex-direction: column; align-items: flex-end; }
.t-label { font-size: 11px; font-weight: bold; opacity: 0.8; }
.countdown-boxes { display: flex; gap: 3px; margin-top: 4px; }
.box-num { background-color: #191919; color: #ffffff; padding: 4px 6px; border-radius: 4px; font-size: 18px; font-weight: bold; font-family: monospace; }
.period-txt { font-size: 12px; margin-top: 5px; font-weight: bold; letter-spacing: 0.5px; }
.color-bet-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 5px; }
.color-btn { border: none; padding: 12px; border-radius: 5px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; }
.bg-green { background-color: #2aa453; }
.bg-violet { background-color: #9c27b0; }
.bg-red { background-color: #d32f2f; }
.bdg-numbers-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; background-color: #252525; padding: 12px; border-radius: 12px; margin-top: 5px; }
.num-ball { border: none; width: 100%; aspect-ratio: 1/1; border-radius: 50%; font-size: 18px; font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 10px rgba(255,255,255,0.3); }
.ball-0 { background: linear-gradient(135deg, #9c27b0 50%, #d32f2f 50%); }
.ball-5 { background: linear-gradient(135deg, #9c27b0 50%, #2aa453 50%); }
.ball-green { background: radial-gradient(circle at 30% 30%, #5cb85c, #2aa453); }
.ball-red { background: radial-gradient(circle at 30% 30%, #d9534f, #d32f2f); }
.multiplier-row { display: flex; gap: 5px; margin-top: 5px; overflow-x: auto; padding: 4px 0; }
.mult-btn { background-color: #333; border: none; color: #ccc; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.mult-btn.active { background-color: #2aa453; color: white; font-weight: bold; }
.size-bet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
.size-btn { border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
.bg-big { background-color: #ff9800; border-top-left-radius: 20px; border-bottom-left-radius: 20px; }
.bg-small { background-color: #2196f3; border-top-right-radius: 20px; border-bottom-right-radius: 20px; }
.history-tabs { display: flex; background-color: #252525; margin-top: 10px; border-radius: 8px 8px 0 0; border-bottom: 1px solid #333; }
.tab-btn { flex: 1; background: none; border: none; color: #aaa; padding: 12px; font-size: 14px; cursor: pointer; font-weight: bold; text-align: center; }
.tab-btn.active { background-color: #f3c343; color: #191919; border-radius: 8px 8px 0 0; }
.history-table { width: 100%; border-collapse: collapse; background-color: #252525; text-align: center; font-size: 12px; }
.history-table th { background-color: #2d2d2d; color: #888; padding: 10px; font-weight: normal; }
.history-table td { padding: 12px 6px; border-bottom: 1px solid #333; color: #ddd; }
.td-num { font-size: 16px; font-weight: bold; }
.text-green { color: #2aa453; }
.text-red { color: #d32f2f; }
.dot-res { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 2px; }
.bet-modal { position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; background-color: #252525; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -5px 25px rgba(0,0,0,0.6); transition: bottom 0.3s ease-in-out; z-index: 1000; padding: 15px; color: white; }
.bet-modal.show { bottom: 0; }
.modal-header { text-align: center; padding: 5px 0 15px; font-size: 16px; font-weight: bold; border-bottom: 1px solid #333; position: relative; }
.close-modal-btn { position: absolute; right: 5px; top: 2px; background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }
.modal-section-title { font-size: 12px; color: #aaa; margin: 12px 0 6px; }
.modal-amount-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mod-amt-btn { background-color: #333; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
.mod-amt-btn.active { background: linear-gradient(180deg, #fbe29a, #cda24d); color: #4a3200; border-color: #cda24d; }
.qty-block { display: flex; align-items: center; justify-content: space-between; background-color: #191919; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; }
.qty-btn { background: none; border: none; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; width: 30px; }
.qty-val { font-size: 16px; font-weight: bold; }
.modal-footer-row { display: flex; gap: 12px; margin-top: 20px; align-items: center; }
.cancel-bet-btn { background-color: #444; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
.confirm-bet-btn { flex: 1; background: linear-gradient(180deg, #2aa453, #166e33); color: white; border: none; padding: 12px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; text-shadow: 1px 1px 2px rgba(0,0,0,0.4); text-align: center; }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; z-index: 999; }
.modal-overlay.show { display: block; }
.custom-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(3px); }
.custom-alert-box { width: 85%; max-width: 340px; background-color: #252525; border-radius: 16px; border: 1px solid #444; padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: scale(0.8); transition: transform 0.2s ease; }
.custom-alert-overlay.show { display: flex; }
.custom-alert-overlay.show .custom-alert-box { transform: scale(1); }
.custom-alert-icon { font-size: 32px; margin-bottom: 12px; }
.custom-alert-title { font-size: 16px; font-weight: bold; color: #f3c343; margin-bottom: 8px; font-family: sans-serif; }
.custom-alert-msg { font-size: 14px; color: #e0e0e0; line-height: 1.4; margin-bottom: 20px; font-family: sans-serif; }
.custom-alert-btn { background: linear-gradient(180deg, #fbe29a, #cda24d); color: #4a3200; border: none; padding: 10px 35px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; box-shadow: 0 4px 10px rgba(205,162,77,0.3); }
.custom-alert-btn:active { opacity: 0.8; }
</style>
</head>
<body>
<div class="game-container">
<div class="top-nav-header">

<svg class="back-icon-svg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>

</div>

<button class="mult-btn" onclick="selectMultiplier(20)">X20</button>

<button class="mult-btn" onclick="selectMultiplier(100)">X100</button>

<div class="history-tabs">

</div>
<table class="history-table">
<thead id="table-head">

</table>
<div class="pagination-container" style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 15px; padding-bottom: 10px;">
<button id="btn-prev" onclick="changePage(-1)" style="background-color: #333; border: 1px solid #444; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">&lt; Prev</button>
<span id="page-number-display" style="font-size: 14px; font-weight: bold; color: #f3c343;">Page 1</span>
<button id="btn-next" onclick="changePage(1)" style="background-color: #333; border: 1px solid #444; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">Next &gt;</button>
</div>
</div>
<div class="modal-overlay" id="betOverlay" onclick="closeBetModal()"></div>

<span id="modal-select-title">Select Green</span>

</div>

<button class="mod-amt-btn active" onclick="selectAmount(1)">₹1</button>
<button class="mod-amt-btn" onclick="selectAmount(10)">₹10</button>
<button class="mod-amt-btn" onclick="selectAmount(100)">₹100</button>
<button class="mod-amt-btn" onclick="selectAmount(500)">₹500</button>
</div>

<button class="qty-btn" onclick="changeQty(-1)">−</button>
<span class="qty-val" id="modal-qty-display">1</span>
<button class="qty-btn" onclick="changeQty(1)">+</button>
</div>
<div class="modal-footer-row">
<button class="cancel-bet-btn" onclick="closeBetModal()">Cancel</button>
<button class="confirm-bet-btn" id="total-bet-submit-btn" onclick="submitFinalBet()">Total Bet ₹1</button>
</div>
</div>
<div class="custom-alert-overlay" id="customAlert">
<div class="custom-alert-box">
<div class="custom-alert-icon" id="customAlertIcon">⚠</div>
<div class="custom-alert-title" id="customAlertTitle">Notification</div>
<div class="custom-alert-msg" id="customAlertMessage">Message text goes here.</div>
<button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
<script>
// 📱 लॉगिन पेज के अनुसार सही नाम ('user_phone') से नंबर निकालना
let userPhone = localStorage.getItem('user_phone');
console.log("Logged in user phone (Fixed Name):", userPhone);
                localStorage.getItem('mobile') ||
                localStorage.getItem('user');

// 🔍 अगर पूरा यूज़र ऑब्जेक्ट सेव है, तो उसमें से नंबर निकालें
if (!userPhone) {
    let userData = localStorage.getItem('userData') || localStorage.getItem('userInfo');
    if (userData) {
        try {
            let parsed = JSON.parse(userData);
            userPhone = parsed.phone || parsed.mobile || parsed.username;
        } catch(e) {
            console.error("Error parsing user data", e);
        }
    }
}

console.log("Logged in user phone (New Check):", userPhone);

console.log("Logged in user phone:", userPhone);

function showAppAlert(title, message, icon = '⚠') {
    document.getElementById("customAlertIcon").innerText = icon;
    document.getElementById("customAlertTitle").innerText = title;
    document.getElementById("customAlertMessage").innerText = message;
    document.getElementById("customAlert").classList.add("show");
}
function closeCustomAlert() {
    document.getElementById("customAlert").classList.remove("show");
}

const API_URL = "https://color-game-1kc2.onrender.com";
const socket = io(API_URL);
const loggedUserPhone = localStorage.getItem('user_phone');
let activeMode = '30s';
let currentTab = 'game';
let allGamesData = {};
let localCountdown = 30;
let currentWalletBalance = 0;
let currentGamePage = 1;
const resultsPerPage = 10;
let selectedBetType = '';
let selectedBetAmount = 1;
let selectedBetQty = 1;

document.addEventListener("DOMContentLoaded", () => {
    if (!loggedUserPhone) {
        showAppAlert("Access Denied", "Please login first to access the game room!", "🔒");
        setTimeout(() => { window.location.href = "index.html"; }, 2000);
        return;
    }
    fetchUserBalance();
    const urlParams = new URLSearchParams(window.location.search);
    const urlMode = urlParams.get('mode');
    if (urlMode && ['30s', '1m', '3m', '5m'].includes(urlMode)) {
        activeMode = urlMode;
    }
});
function fetchUserBalance() {
    if (!loggedUserPhone) return;
    fetch(`${API_URL}/api/balance/${loggedUserPhone}`)
        .then(res => {
            if (!res.ok) throw new Error("Server busy");
            return res.json();
        })
        .then(data => {
            if (data.success) {
                currentWalletBalance = data.balance;
                document.querySelector(".balance-title").innerText = "₹" + data.balance.toFixed(2);
            }
        })
        .catch(err => {
            // 🤫 यहाँ स्क्रीन वाले alert() पॉपअप को हटा दिया गया है ताकि खिलाड़ी को एरर न दिखे
            console.log("Wallet balance sync delayed safely.");
        });
}


function goToHome() { window.location.href = "home.html"; }

function selectMultiplier(val) {
    document.querySelectorAll('.multiplier-row .mult-btn').forEach(btn => btn.classList.remove('active'));
    if(typeof event !== 'undefined' && event.target) event.target.classList.add('active');
    selectedBetQty = val;
    document.getElementById("modal-qty-display").innerText = val;
    calculateTotalBet();
}

function switchGameMode(modeKey) {
    currentGamePage = 1;
    activeMode = modeKey;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    const targetBtn = document.getElementById(`mode-${modeKey}`);
    if(targetBtn) targetBtn.classList.add('active');
    let titleMap = { '30s': 'WinGo 30sec', '1m': 'WinGo 1 Min', '3m': 'WinGo 3 Min', '5m': 'WinGo 5 Min' };
    document.getElementById("current-game-title").innerText = titleMap[modeKey] || 'Win Go';
    
    if (allGamesData[modeKey]) {
        let game = allGamesData[modeKey];
        localCountdown = game.countdown;
        updateTimerUI(game.countdown);
        document.getElementById("period-display").innerText = game.period || "Loading...";
        if(currentTab === 'game') {
            renderGameTable(game.history);
        } else {
            fetchMyHistory();
        }
        updateRecentBalls(game.history);
    }
}

// ✅ इसे अपनी फाइल में बदलें
function changeTab(tabName) {
  currentTab = tabName;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById("history-rows").innerHTML = ""; // पुरानी लिस्ट साफ़ करें
  
  if (tabName === 'game') {
    document.getElementById('tab-game').classList.add('active');
    document.getElementById('table-head').innerHTML = `<tr><th>Period</th><th>Number</th><th>Big Small</th><th>Color</th></tr>`;
    if (allGamesData[activeMode]) renderGameTable(allGamesData[activeMode].history);
  } else {
    document.getElementById('tab-my').classList.add('active');
    // 📊 माई हिस्ट्री के लिए सही हेडर सेट करें
    document.getElementById('table-head').innerHTML = `<tr><th>Period</th><th>Select</th><th>Amount</th><th>Result</th></tr>`;
    fetchMyHistory(); // 🚀 यूज़र का खुद का डेटा डेटाबेस से मंगाएं
  }
}

function placeBet(type) {
    if (localCountdown <= 5) {
        showAppAlert("Round Closed", "Time over! This game round has closed.", "🛑");
        closeBetModal();
        return;
    }
    selectedBetType = type;
    selectedBetAmount = 1;
    selectedBetQty = 1;
    document.getElementById("modal-select-title").innerText = "Select " + type + " [" + activeMode.toUpperCase() + "]";
    document.getElementById("modal-qty-display").innerText = "1";
    document.querySelectorAll('.mod-amt-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector('.mod-amt-btn').classList.add('active');
    calculateTotalBet();
    document.getElementById("betModal").classList.add("show");
    document.getElementById("betOverlay").classList.add("show");
}

function closeBetModal() {
    document.getElementById("betModal").classList.remove("show");
    document.getElementById("betOverlay").classList.remove("show");
}

function selectAmount(amt) {
    selectedBetAmount = amt;
    document.querySelectorAll('.mod-amt-btn').forEach(btn => btn.classList.remove('active'));
    if(typeof event !== 'undefined' && event.target) event.target.classList.add('active');
    calculateTotalBet();
}

function changeQty(val) {
    selectedBetQty += val;
    if (selectedBetQty < 1) selectedBetQty = 1;
    document.getElementById("modal-qty-display").innerText = selectedBetQty;
    calculateTotalBet();
}

function calculateTotalBet() {
    let total = selectedBetAmount * selectedBetQty;
    document.getElementById("total-bet-submit-btn").innerText = "Total Bet ₹" + total;
}

function submitFinalBet() {
    let totalAmount = selectedBetAmount * selectedBetQty;
    if (localCountdown <= 5) {
        showAppAlert("Timeout", "Round closed! Time is over.", "⚠");
        closeBetModal();
        return;
    }
    if (totalAmount > currentWalletBalance) {
        showAppAlert("Insufficient Balance", `Your wallet balance is insufficient. Please deposit funds.`, "🔴");
        return;
    }
    socket.emit('place_bet', {
        phone: loggedUserPhone,
        mode: activeMode,
        selectValue: selectedBetType,
        amount: totalAmount
    });
    closeBetModal();
}
socket.on('bet_response', (data) => {
    if (data.success) {
        showAppAlert("Success", "Your bet has been placed successfully!", "✅");
        currentWalletBalance = data.newBalance;
        document.querySelector(".balance-title").innerText = "₹" + data.newBalance.toFixed(2);
        if (currentTab === 'my') fetchMyHistory();
    } else {
        showAppAlert("Error", data.message || "Failed to place bet.", "❌");
    }
});

socket.on('all_modes_state', (modesData) => {
    allGamesData = modesData;
    let titleMap = { '30s': 'WinGo 30sec', '1m': 'WinGo 1 Min', '3m': 'WinGo 3 Min', '5m': 'WinGo 5 Min' };
    document.getElementById("current-game-title").innerText = titleMap[activeMode] || 'Win Go';
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    const targetBtn = document.getElementById(`mode-${activeMode}`);
    if(targetBtn) targetBtn.classList.add('active');
    let activeGame = allGamesData[activeMode];
    if (activeGame) {
        localCountdown = activeGame.countdown;
        updateTimerUI(activeGame.countdown);
        document.getElementById("period-display").innerText = activeGame.period || "Loading...";
        if(currentTab === 'game') {
            renderGameTable(activeGame.history);
        } else {
            fetchMyHistory();
        }
        updateRecentBalls(activeGame.history);
    }
});

socket.on('time_update', (data) => {
    if (!allGamesData[data.mode]) allGamesData[data.mode] = {};
    allGamesData[data.mode].countdown = data.countdown;
    allGamesData[data.mode].period = data.period;
    if (data.mode === activeMode) {
        localCountdown = data.countdown;
        updateTimerUI(data.countdown);
        document.getElementById("period-display").innerText = data.period || "Loading...";
        if (data.countdown <= 5) { closeBetModal(); }
    }
});

socket.on('game_result', (data) => {
  if (!allGamesData[data.mode]) allGamesData[data.mode] = {};
  allGamesData[data.mode].history = data.history;
  
  if (data.mode === activeMode) {
    if(currentTab === 'game') {
      renderGameTable(data.history);
    } else {
      // 🔄 अगर यूजर My History देख रहा है, तो रिजल्ट आते ही उसकी लिस्ट तुरंत अपडेट करें
      fetchMyHistory();
    }
    updateRecentBalls(data.history);
    
    setTimeout(() => {
      fetchUserBalance();
    }, 1500);
  }
});



function updateTimerUI(timeLeft) {
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;
    let mStr = minutes < 10 ? "0" + minutes : "" + minutes;
    let sStr = seconds < 10 ? "0" + seconds : "" + seconds;
    document.getElementById("t-min1").innerText = mStr.charAt(0);
    document.getElementById("t-min2").innerText = mStr.charAt(1);
    document.getElementById("t-sec1").innerText = sStr.charAt(0);
    document.getElementById("t-sec2").innerText = sStr.charAt(1);
}

function renderGameTable(history) {
    const tbody = document.getElementById("history-rows");
    tbody.innerHTML = "";
    if (!history || history.length === 0) return;
    let startIndex = (currentGamePage - 1) * resultsPerPage;
    let endIndex = startIndex + resultsPerPage;
    let paginatedHistory = history.slice(startIndex, endIndex);
    paginatedHistory.forEach(row => {
        let colorHTML = '';
        let numClass = 'text-green';
        let rCol = row.color ? row.color : '';
        if (rCol.includes('Red')) { colorHTML += `<span class="dot-res bg-red"></span>`; numClass = 'text-red'; }
        if (rCol.includes('Green')) { colorHTML += `<span class="dot-res bg-green"></span>`; }
        if (rCol.includes('Violet')) { colorHTML += `<span class="dot-res bg-violet"></span>`; }
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${row.period}</td><td class="td-num ${numClass}">${row.number}</td><td>${row.bigSmall || (row.number >= 5 ? 'Big' : 'Small')}</td><td>${colorHTML}</td>`;
        tbody.appendChild(tr);
    });
    document.getElementById("page-number-display").innerText = "Page " + currentGamePage;
    document.getElementById("btn-prev").disabled = (currentGamePage === 1);
    document.getElementById("btn-next").disabled = (endIndex >= history.length);
}

function changePage(direction) {
    currentGamePage += direction;
    if (currentGamePage < 1) currentGamePage = 1;
    if (allGamesData[activeMode]) { renderGameTable(allGamesData[activeMode].history); }
}

function updateRecentBalls(history) {
    const row = document.getElementById("recent-balls-row");
    row.innerHTML = "";
    if(!history || history.length === 0) return;
    let sliceData = history.slice(0, 4);
    sliceData.forEach(game => {
        let bgClass = game.color.includes('Red') ? 'bg-red' : 'bg-green';
        if(game.number === 0 || game.number === 5) {
            let splitColor = (game.number === 0) ? 'background: linear-gradient(135deg, #9c27b0 50%, #d32f2f 50%);' : 'background: linear-gradient(135deg, #9c27b0 50%, #2aa453 50%);';
            row.innerHTML += `<div class="ball-sm" style="width:16px; height:16px; border-radius:50%; font-size:9px; color:white; text-align:center; line-height:16px; font-weight:bold; ${splitColor}">${game.number}</div>`;
        } else {
            row.innerHTML += `<div class="ball-sm ${bgClass}">${game.number}</div>`;
        }
    });
}

function fetchMyHistory() {
  // अगर अभी भी नंबर नहीं मिला, तो दोबारा चेक करें
  if (!userPhone) {
    userPhone = localStorage.getItem('userPhone') || localStorage.getItem('phone');
  }

  // 🔒 सुरक्षा चेक: अगर लॉगइन नंबर बिल्कुल गायब है
  if (!userPhone) {
    console.error("User phone number is missing! Please re-login.");
    return;
  }

  // 🚀 सर्वर को रिक्वेस्ट भेजें
  socket.emit('get_my_history', { phone: userPhone, mode: activeMode });
}

socket.on('bet_outcome', (data) => {
    if (data.status === 'WIN') {
        showAppAlert("Congratulations!", `Period ${data.period} is out! You WON ₹${data.winAmount.toFixed(2)}! 🎉`, "🏆");
    } else {
        showAppAlert("Game Result", `Period ${data.period} is out. Result: LOSS. Better luck next time!`, "💸");
    }
    fetchUserBalance();
    if(currentTab === 'my') fetchMyHistory();
});

socket.on('my_history_data', (data) => {
  if (currentTab !== 'my') return;
  const tbody = document.getElementById("history-rows");
  tbody.innerHTML = "";
  
  if (!data.success || !data.bets || data.bets.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" style="color:#888; padding:20px;">No betting records found</td></tr>`;
    return;
  }
  
  data.bets.forEach(bet => {
    let statusStyle = 'color: #aaa;';
    if (bet.status === 'WIN') statusStyle = 'color: #2aa453; font-weight: bold;';
    if (bet.status === 'LOSS') statusStyle = 'color: #d32f2f;';
    
    let resultText = bet.status;
    if (bet.status === 'WIN') resultText = `Win (+₹${bet.winAmount.toFixed(2)})`;
    
    const tr = document.createElement('tr');
    // ✅ इसे बिना तोड़े बिल्कुल एक ही सिंगल लाइन में रखना भाई
    tr.innerHTML = `<td>${bet.period}</td><td style="font-weight: bold; color: #f3c343;">${bet.selectValue}</td><td>₹${bet.amount}</td><td style="${statusStyle}">${resultText}</td>`;
    tbody.appendChild(tr);
  });
});

</script>
</body>
</html>
