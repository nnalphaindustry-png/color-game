<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>91 Goa Club - Activity</title>
    <style>
        :root {
            color-scheme: light !important;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            -webkit-text-fill-color: initial !important;
        }
        body {
            background-color: #f4f6fb !important;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        /* Mobile View App Container */
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #f4f6fb !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        /* Clean Top Header Layout */
        .navbar {
            background-color: #ffffff !important;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eef2f5 !important;
        }
        .back-btn {
            color: #333333;
            font-size: 22px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }
        .record-btn {
            font-size: 14px;
            font-weight: bold;
            color: #f03e3e !important;
            cursor: pointer;
            user-select: none;
        }
        /* Main Activity Banner Style */
        .banner-container {
            width: 100%;
            padding: 12px;
        }
        .banner-img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            display: block;
            object-fit: cover;
        }
        /* Premium Custom Popup (Modal) CSS */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .popup-box {
            background: #ffffff;
            width: 85%;
            max-width: 360px;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .popup-overlay.show .popup-box {
            transform: scale(1);
        }
        /* Inner Popup Visual Graphic */
        .popup-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px auto;
            background: #f8f9fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .popup-box h3 {
            font-size: 18px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 8px;
        }
        .popup-box p {
            font-size: 13px;
            color: #777777;
            line-height: 18px;
            margin-bottom: 20px;
        }
        .popup-close-btn {
            background: linear-gradient(to right, #ff4d4d, #ff6b6b);
            color: white !important;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.2);
            outline: none;
        }
        .popup-close-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
<div class="app-container">
    
    <!-- TOP NAVBAR -->
    <div class="navbar">
        <!-- बाईं तरफ होम पर जाने के लिए बैक बटन -->
        <a href="activity.html" class="back-btn">&#10094;</a>
        
        <!-- दाईं तरफ कोने में Collection Record बटन -->
        <span class="record-btn" onclick="openRecordPopup()">Collection Record</span>
    </div>

    <!-- MAIN ACTIVITY BANNER -->
    <div class="banner-container">
        <img src="activity.jpg" alt="Activity Banner" class="banner-img">
    </div>

    <!-- SUNDAR POPUP BOX (MODAL LAYER) -->
    <div class="popup-overlay" id="recordPopupOverlay">
        <div class="popup-box">
            <!-- In-built SVG Empty Icon for Box -->
            <div class="popup-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>
            </div>
            
            <!-- English Messages inside Popup -->
            <h3>No Collection Found</h3>
            <p>You have not received any activity bonus or collection records yet.</p>
            
            <!-- Close Button -->
            <button class="popup-close-btn" onclick="closeRecordPopup()">Confirm</button>
        </div>
    </div>

</div>
<script>
    // पॉपअप को स्क्रीन पर दिखाने का फंक्शन
    function openRecordPopup() {
        const popup = document.getElementById('recordPopupOverlay');
        if (popup) {
            popup.classList.add('show');
        }
    }

    // पॉपअप को स्क्रीन से हटाने/बंद करने का फंक्शन
    function closeRecordPopup() {
        const popup = document.getElementById('recordPopupOverlay');
        if (popup) {
            popup.classList.remove('show');
        }
    }

    // सिक्योरिटी चेक: अगर यूज़र बिना लॉगिन के आएगा तो सीधे बाहर फेंक देगा (आपके डैशबोर्ड जैसा सेम लॉजिक)
    document.addEventListener("DOMContentLoaded", function () {
        const sessionUser = localStorage.getItem('user_phone');
        if (!sessionUser) {
            window.location.href = "index.html"; 
        }
    });
</script>
</body>
</html>
