<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>91 GOA CLUB - Admin C-Panel</title>
    <!-- Premium Google Font -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f4f6fb;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .admin-wrapper {
            width: 100%;
            max-width: 1000px;
            background: #111827;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #1f2937;
        }

        /* 1. Header Metrics Dashboard Grid */
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .admin-title-txt {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff4e50, #f03e3e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .refresh-list-btn {
            background: #1f2937;
            color: #fff;
            border: 1px solid #374151;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-list-btn:hover {
            background: #374151;
        }

        /* 2. Responsive Table Grid Styles */
        .table-responsive-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #1f2937;
            background: #1f2937;
        }

        .deposit-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        .deposit-table th {
            background-color: #111827;
            color: #9ca3af;
            padding: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-size: 13px;
            border-bottom: 1px solid #1f2937;
        }

        .deposit-table td {
            padding: 16px;
            color: #e5e7eb;
            border-bottom: 1px solid #1f2937;
            font-weight: 500;
        }

        .deposit-table tr:last-child td {
            border-bottom: none;
        }

        /* 3. Action Badges and Approve Buttons */
        .utr-highlight-txt {
            font-family: monospace;
            font-size: 15px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .amount-badge-txt {
            color: #10b981;
            font-weight: 700;
            font-size: 15px;
        }

        .approve-action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
            transition: transform 0.1s ease;
        }

        .approve-action-btn:active {
            transform: scale(0.96);
        }

        /* Status Pills styling */
        .status-pill-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        /* Empty State */
        .no-data-alert-box {
            padding: 40px;
            text-align: center;
            color: #9ca3af;
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        
        <!-- 1. Dashboard Header Section -->
        <header class="admin-header">
            <div>
                <h1 class="admin-title-txt">91 GOA CLUB</h1>
                <p style="font-size: 12px; color: #9ca3af; margin-top: 2px;">Live Deposit Approval Center (C-Panel)</p>
            </div>
            <!-- मैन्युअल लिस्ट रीफ्रेश करने का बटन -->
            <button class="refresh-list-btn" onclick="loadPendingDepositsList();">🔄 Fetch Live List</button>
        </header>

        <!-- 2. Dynamic Live Requests Table Layout Grid -->
        <div class="table-responsive-container">
            <table class="deposit-table" id="requests-grid-table">
                <thead>
                    <tr>
                        <th>PLAYER PHONE</th>
                        <th>DEPOSIT AMOUNT</th>
                        <th>12-DIGIT UTR NUMBER</th>
                        <th>ORDER STATUS</th>
                        <th>ACTION CONTROL</th>
                    </tr>
                </thead>
                <tbody id="pending-list-table-body">
                    <!-- जावास्क्रिप्ट के ज़रिए लाइव रिक्वेस्ट्स यहाँ लोड होकर सड़ेंगी -->
                </tbody>
            </table>
            
            <!-- डेटा खाली होने पर दिखने वाला सुंदर मैसेज बॉक्स -->
            <div id="empty-state-view" class="no-data-alert-box" style="display: none;">
                🎉 All caught up! No pending deposit requests found.
            </div>
        </div>

    </div>
        <!-- 3. Secure C-Panel Sync Engine JavaScript -->
    <script>
        const LIVE_SERVER_URL = "https://color-game-1kc2.onrender.com";

        document.addEventListener("DOMContentLoaded", function() {
            // पेज खुलते ही लाइव पेंडिंग रिक्वेस्ट की लिस्ट लोड करना
            loadPendingDepositsList();
        });

        // १. डेटाबेस से सभी 'PENDING' रीचार्ज रिक्वेस्ट्स खींचकर टेबल में सजाने का फंक्शन
        function loadPendingDepositsList() {
            const tableBody = document.getElementById('pending-list-table-body');
            const emptyView = document.getElementById('empty-state-view');
            const mainTable = document.getElementById('requests-grid-table');

            tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #9ca3af;">⏳ Loading live database logs...</td></tr>`;
            emptyView.style.display = "none";

            fetch(`${LIVE_SERVER_URL}/api/admin/deposits/pending`)
                .then(response => response.json())
                .then(res => {
                    if (res.success && res.data.length > 0) {
                        tableBody.innerHTML = ""; // पुराना लोडिंग डेटा साफ करें
                        
                        // हर एक पेंडिंग रिक्वेस्ट को लूप चलाकर टेबल में एक सुंदर रो (Row) बनाना
                        res.data.forEach(order => {
                            const tableRowHTML = `
                                <tr>
                                    <td style="font-weight: 600;">📱 ${order.phone}</td>
                                    <td><span class="amount-badge-txt">₹${Number(order.amount).toFixed(2)}</span></td>
                                    <td><span class="utr-highlight-txt">${order.utrNumber}</span></td>
                                    <td><span class="status-pill-pending">${order.status}</span></td>
                                    <td>
                                        <button class="approve-action-btn" onclick="processDepositApproval('${order.utrNumber}', ${order.amount}, '${order.phone}');">
                                            ✅ Approve Pass
                                        </button>
                                    </td>
                                </tr>
                            `;
                            tableBody.insertAdjacentHTML('beforeend', tableRowHTML);
                        });
                    } else {
                        // अगर कोई पेंडिंग रिक्वेस्ट नहीं है तो खाली लुक दिखाएं
                        tableBody.innerHTML = "";
                        emptyView.style.display = "block";
                    }
                })
                .catch(err => {
                    console.error("Database connection error:", err);
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444;">❌ Failed to connect with Live Render Server!</td></tr>`;
                });
        }

        // २. हरे बटन पर क्लिक करते ही खिलाड़ी का असली बैलेंस बढ़ाने और आर्डर सक्सेसफुल करने का मुख्य फंक्शन
        function processDepositApproval(utrNum, orderAmt, playerPhone) {
            // सुरक्षा पुष्टीकरण पॉपअप
            const isConfirmed = confirm(`Are you sure you want to APPROVE ₹${orderAmt} for player ${playerPhone}?\nUTR: ${utrNum}`);
            if (!isConfirmed) return;

            // बटन को तुरंत डिसएबल करना ताकि डबल क्लिक से दो बार बैलेंस न बढ़े
            event.target.disabled = true;
            event.target.innerText = "⏳ Processing...";

            // बैकएंड सर्वर की अप्रूवल API को कॉल भेजना
            fetch(`${LIVE_SERVER_URL}/api/admin/deposit/approve`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ utrNumber: utrNum })
            })
            .then(response => response.json())
            .then(res => {
                if (res.success) {
                    alert(`✅ Success! ₹${orderAmt} has been credited to ${playerPhone}.`);
                    loadPendingDepositsList(); // लिस्ट को तुरंत रीफ्रेश करके साफ़ करें
                } else {
                    alert(`❌ Error: ${res.message}`);
                    loadPendingDepositsList();
                }
            })
            .catch(err => {
                console.error("Approval Server error:", err);
                alert("❌ Server Connection Failure! Check render logs.");
                loadPendingDepositsList();
            });
        }
    </script>
</body>
</html>
