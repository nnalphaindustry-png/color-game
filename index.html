<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>91 GOA CLUB - Login & Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f4f6fb; display: flex; justify-content: center; min-height: 100vh; }
        .main-container { width: 100%; max-width: 450px; background-color: #ffffff; min-height: 100vh; position: relative; padding-bottom: 40px; }
        .header-banner { background: linear-gradient(180deg, #ff4d4d, #f03e3e); padding: 40px 20px; color: white; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        .header-banner h1 { font-size: 28px; margin-bottom: 5px; letter-spacing: 1px; }
        .tab-container { display: flex; justify-content: space-around; margin: 20px 0; border-bottom: 2px solid #f1f3f5; }
        .tab-btn { font-size: 16px; font-weight: 600; padding: 10px 20px; border: none; background: none; cursor: pointer; color: #8e9aa7; width: 50%; text-align: center; outline: none; }
        .tab-btn.active { color: #f03e3e; border-bottom: 3px solid #f03e3e; }
        .form-box { padding: 0 24px; display: none; }
        .form-box.active { display: block; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 14px; color: #333; margin-bottom: 8px; font-weight: 600; }
        .input-group input { width: 100%; height: 48px; border: 1px solid #ced4da; border-radius: 12px; padding: 0 15px; font-size: 15px; background-color: #f8f9fa; outline: none; }
        .input-group input:focus { border-color: #f03e3e; background-color: #fff; }
        .action-btn { width: 100%; height: 48px; background: linear-gradient(135deg, #ff4d4d, #f03e3e); border: none; border-radius: 24px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(240, 62, 62, 0.2); }
        .extra-links-container { display: flex; justify-content: space-between; margin-top: 20px; padding: 0 5px; }
        .extra-link { font-size: 14px; color: #f03e3e; text-decoration: none; font-weight: 500; cursor: pointer; }
        .extra-link:hover { text-decoration: underline; }
        .footer-links { text-align: center; margin-top: 35px; font-size: 14px; color: #6c757d; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-banner">
        <h1>91 GOA CLUB</h1>
        <p>Welcome to premium color game</p>
    </div>

    <div class="tab-container">
        <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Log In</button>
        <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form" class="form-box active">
        <div class="input-group">
            <label>Phone Number</label>
            <input type="number" id="login-phone" placeholder="Enter your phone number">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Enter your password">
        </div>
        <button class="action-btn" onclick="handleLogin()">Log In</button>

        <!--  : Forgot Password  Customer Service -->
        <div class="extra-links-container">
            <a class="extra-link" onclick="alert('Please contact Customer Support to reset your password.')"> Forgot password</a>
            <a class="extra-link" onclick="alert('Redirecting to Customer Support Telegram/LiveChat...')"> Customer Service</a>
        </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form" class="form-box">
        <div class="input-group">
            <label>Phone Number</label>
            <input type="number" id="reg-phone" placeholder="Enter new phone number">
        </div>
        <div class="input-group">
            <label>Set Password</label>
            <input type="password" id="reg-password" placeholder="Enter strong password">
        </div>
        <!--  : Confirm Password -->
        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="reg-confirm-password" placeholder="Confirm your password">
        </div>
        <!--  : Invite Code -->
        <div class="input-group">
            <label>Invite Code</label>
            <input type="text" id="reg-invite" placeholder="Enter invite code (Optional)">
        </div>
        <button class="action-btn" onclick="handleRegister()">Register</button>
    </div>

    <div class="footer-links">
        <p> Secure Database Connection</p>
    </div>
</div>

<script>
    const BACKEND_URL = "https://onrender.com";

    function switchTab(type) {
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        if(type === 'login') {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
        } else {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
        }
    }

    function handleRegister() {
        const phone = document.getElementById('reg-phone').value.trim();
        const password = document.getElementById('reg-password').value.trim();
        const confirmPassword = document.getElementById('reg-confirm-password').value.trim();
        const inviteCode = document.getElementById('reg-invite').value.trim();

        if(!phone || !password || !confirmPassword) {
            alert("Please fill all required fields!");
            return;
        }

        if(password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        fetch(`${BACKEND_URL}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password, confirmPassword, inviteCode })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            if(data.success) {
                switchTab('login');
            }
        })
        .catch(err => {
            console.error(err);
            alert("Registration failed! Check server connection.");
        });
    }

    function handleLogin() {
        const phone = document.getElementById('login-phone').value.trim();
        const password = document.getElementById('login-password').value.trim();

        if(!phone || !password) {
            alert("Please fill all fields!");
            return;
        }

        fetch(`${BACKEND_URL}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            if(data.success) {
                localStorage.setItem('user_phone', data.phone);
                window.location.href = "profile.html"; 
            }
        })
        .catch(err => {
            console.error(err);
            alert("Login failed! Server is not responding.");
        });
    }
</script>
</body>
</html>
