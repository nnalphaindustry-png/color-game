<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM GAME - Agency Center</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
body { background-color: #191919; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding-bottom: 30px; }
.app-container { width: 100%; max-width: 450px; background-color: #191919; display: flex; flex-direction: column; overflow-x: hidden; position: relative; padding: 15px; }

/* Header */
.agency-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #252525; padding-bottom: 15px; }
.back-btn { background: none; border: none; color: #ffffff; font-size: 24px; cursor: pointer; }
.agency-title { font-size: 18px; font-weight: bold; color: #ffffff; letter-spacing: 0.5px; text-align: center; flex: 1; margin-right: 24px; }

/* Dashboard Cards */
.stats-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background-color: #252525; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.stat-card.full-width { grid-column: span 2; background: linear-gradient(180deg, #dbb35e, #c79a49); border: none; }
.stat-card.full-width .stat-label { color: #4a3200; font-weight: bold; }
.stat-card.full-width .stat-num { color: #4a3200; font-size: 24px; }
.stat-num { font-size: 18px; font-weight: bold; color: #ffffff; margin-top: 5px; }
.stat-label { font-size: 12px; color: #aaaaaa; }

/* Link Copy Box */
.invite-box { background-color: #252525; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
.invite-title { font-size: 14px; font-weight: bold; color: #ffffff; margin-bottom: 10px; text-align: left; }
.link-display { background-color: #191919; padding: 10px; border-radius: 8px; color: #dbb35e; font-size: 12px; margin-bottom: 12px; word-break: break-all; border: 1px solid #333; text-align: left; }
.copy-btn { background: linear-gradient(180deg, #fbe29a, #cda24d); color: #4a3200; border: none; padding: 10px 20px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; transition: opacity 0.2s; }
.copy-btn:active { opacity: 0.8; }

/* Big Action Buttons */
.action-menu-btn { display: flex; align-items: center; justify-content: space-between; background-color: #252525; border: none; color: #ffffff; padding: 16px 20px; border-radius: 12px; margin-bottom: 12px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; text-align: left; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
.action-menu-btn .icon-side { display: flex; align-items: center; gap: 12px; }
.action-menu-btn .arrow { color: #666666; font-size: 18px; }

/* Popup Modals (Universal Style) */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: flex-end; }
.modal-content { background-color: #252525; width: 100%; max-width: 450px; border-top-left-radius: 25px; border-top-right-radius: 25px; padding: 20px; max-height: 80vh; overflow-y: auto; color: #ffffff; animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
.modal-title { font-size: 16px; font-weight: bold; color: #dbb35e; }
.close-modal-btn { background: none; border: none; color: #aaaaaa; font-size: 24px; cursor: pointer; }

/* Mission Rows Style */
.mission-card { display: flex; justify-content: space-between; align-items: center; background-color: #191919; padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #333; }
.mission-info { display: flex; flex-direction: column; gap: 4px; text-align: left; }
.mission-target { font-size: 13px; font-weight: bold; color: #ffffff; }
.mission-reward { font-size: 12px; color: #dbb35e; font-weight: bold; }
.mission-progress { font-size: 11px; color: #888888; }
.claim-btn { background: linear-gradient(180deg, #fbe29a, #cda24d); color: #4a3200; border: none; padding: 6px 15px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; }
.claim-btn:disabled { background: #444444; color: #888888; cursor: not-allowed; }

/* Invited Users Rows Style */
.user-item { display: flex; justify-content: space-between; padding: 12px 15px; background-color: #191919; border-radius: 10px; margin-bottom: 8px; border: 1px solid #333; font-size: 13px; text-align: left; }
.status-valid { color: #00cc66; font-weight: bold; }
.status-pending { color: #ff9933; font-weight: bold; }
</style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="agency-header">
        <button class="back-btn" onclick="window.location.href='home.html'">←</button>
        <div class="agency-title">Agency Center</div>
    </div>

    <!-- Agent Dashboard Stats -->
    <div class="stats-container">
        <div class="stat-card full-width">
            <div class="stat-label">Total Commission & Rewards Earned</div>
            <div class="stat-num" id="total-earned">₹0.00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Commission Wallet</div>
            <div class="stat-num" id="promo-balance">₹0.00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Direct Invites</div>
            <div class="stat-num" id="total-invites">0</div>
        </div>
    </div>

    <!-- Invitation Link Box -->
    <div class="invite-box">
        <div class="invite-title">🔗 Your Exclusive Invite Link</div>
        <div class="link-display" id="invite-url">Loading link...</div>
        <button class="copy-btn" onclick="copyLink()">Copy Invite Link</button>
    </div>

    <!-- 🏆 Main Navigation Buttons (Clean UI) -->
    <button class="action-menu-btn" onclick="openModal('missionsModal')">
        <div class="icon-side"><span>🏆</span> Agent Mission Rewards</div>
        <div class="arrow">➔</div>
    </button>

    <button class="action-menu-btn" onclick="openModal('usersModal')">
        <div class="icon-side"><span>👥</span> Invited Users List</div>
        <div class="arrow">➔</div>
    </button>
</div>

<!-- 📦 POPUP 1: Agent Mission Rewards -->
<div id="missionsModal" class="modal-overlay" onclick="closeModalOnOutsideClick(event, 'missionsModal')">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">🏆 Agency Mission Rewards</div>
            <button class="close-modal-btn" onclick="closeModal('missionsModal')">&times;</button>
        </div>
        <div id="missions-container">
            <!-- Loaded dynamically from backend -->
        </div>
    </div>
</div>

<!-- 📦 POPUP 2: Invited Users List -->
<div id="usersModal" class="modal-overlay" onclick="closeModalOnOutsideClick(event, 'usersModal')">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">👥 Invited Users List</div>
            <button class="close-modal-btn" onclick="closeModal('usersModal')">&times;</button>
        </div>
        <div id="users-container" style="max-height: 50vh; overflow-y: auto;">
            <!-- Loaded dynamically from backend -->
        </div>
    </div>
</div>
<script>
const userPhone = localStorage.getItem('user_phone');
const API_BASE_URL = "https://color-game-1kc2.onrender.com"; // आपका लाइव रेंडर सर्वर

// मिशन्स की पूरी मास्टर लिस्ट (बैकएंड के अनुसार)
const milestones = [
    { id: 1, count: 1, reward: 50 },
    { id: 2, count: 3, reward: 150 },
    { id: 3, count: 5, reward: 250 },
    { id: 4, count: 10, reward: 500 },
    { id: 5, count: 50, reward: 3000 },
    { id: 6, count: 100, reward: 7000 },
    { id: 7, count: 200, reward: 16000 },
    { id: 8, count: 500, reward: 45000 },
    { id: 9, count: 1000, reward: 100000 }
];

document.addEventListener("DOMContentLoaded", () => {
    if (!userPhone) {
        alert("Session Expired: Please login first!");
        window.location.href = "index.html";
        return;
    }
    // इनवाइट लिंक सेट करना
    document.getElementById('invite-url').innerText = window.location.origin + "/index.html?ref=" + userPhone;
    
    // लाइव सर्वर से डेटा लोड करना
    fetchAgencyDashboardData();
});

function fetchAgencyDashboardData() {
    fetch(`${API_BASE_URL}/api/agency/dashboard/${userPhone}`)
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                // मुख्य डैशबोर्ड अपडेट करें
                document.getElementById('total-earned').innerText = "₹" + data.totalEarned.toFixed(2);
                document.getElementById('promo-balance').innerText = "₹" + data.promoBalance.toFixed(2);
                document.getElementById('total-invites').innerText = data.totalInvites;

                // 1. मिशन्स पॉपअप का डेटा लोड करें
                renderMissionsList(data.validInvitesCount, data.claimedMissions);

                // 2. यूज़र्स लिस्ट पॉपअप का डेटा लोड करें
                renderUsersList(data.invitedUsers);
            }
        })
        .catch(err => console.error("Error loading agency data:", err));
}

function renderMissionsList(validCount, claimedMissions) {
    const container = document.getElementById('missions-container');
    container.innerHTML = '';

    milestones.forEach(m => {
        const isClaimed = claimedMissions.includes(m.id);
        const isEligible = validCount >= m.count && !isClaimed;
        let btnText = isClaimed ? "Claimed" : "Claim";

        const card = document.createElement('div');
        card.className = 'mission-card';
        card.innerHTML = `
            <div class="mission-info">
                <div class="mission-target">Invite ${m.count} Valid Users (₹300+)</div>
                <div class="mission-reward">Bonus: ₹${m.reward}</div>
                <div class="mission-progress">Progress: ${validCount}/${m.count}</div>
            </div>
            <button class="claim-btn" ${!isEligible ? 'disabled' : ''} onclick="claimMissionReward(${m.id})">${btnText}</button>
        `;
        container.appendChild(card);
    });
}

function renderUsersList(users) {
    const container = document.getElementById('users-container');
    container.innerHTML = '';

    if (users.length === 0) {
        container.innerHTML = '<div style="color:#aaa; text-align:center; padding:20px;">No users invited yet.</div>';
        return;
    }

    users.forEach(u => {
        const statusClass = u.status.startsWith('Valid') ? 'status-valid' : 'status-pending';
        const item = document.createElement('div');
        item.className = 'user-item';
        item.innerHTML = `
            <div>
                <div style="font-weight:bold;">Member: ${u.phone}</div>
                <div style="font-size:11px; color:#666; margin-top:2px;">Reg Date: ${u.date}</div>
            </div>
            <div class="${statusClass}">${u.status.split(' ')[0]}</div>
        `;
        container.appendChild(item);
    });
}

function claimMissionReward(missionId) {
    fetch(`${API_BASE_URL}/api/agency/claim-mission`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: userPhone, missionId: missionId })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if (data.success) {
            fetchAgencyDashboardData(); // डेटा रीलोड करें
        }
    })
    .catch(err => console.error("Error claiming reward:", err));
}

function copyLink() {
    const urlText = document.getElementById('invite-url').innerText;
    navigator.clipboard.writeText(urlText).then(() => {
        alert("Invite link copied successfully!");
    });
}

/* पॉपअप्स ओपन/क्लोज़ फंक्शंस */
function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
function closeModalOnOutsideClick(e, modalId) { if (e.target.id === modalId) closeModal(modalId); }
</script>
</body>
</html>
